# cargo-deny configuration: licenses, advisories, bans and sources.
[graph]
targets = ["x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl", "x86_64-unknown-linux-gnu"]

[advisories]
ignore = [
  # SQLite < 3.54.0 can leak page-cache memory when it opens a database together with a
  # crafted -wal file. Local attack vector: it needs someone else to write the database
  # files. Sitewright's database lives in an owner-only (0700) data directory and is only
  # ever written by the daemon itself, so there is no less-trusted writer. No sqlx release
  # accepts the fixed libsqlite3-sys (>= 0.39) yet; remove this entry when one does.
  { id = "RUSTSEC-2026-0459", reason = "local-only; database files are written only by the daemon; no fixed sqlx release yet" },
  # Marvin attack on the `rsa` crate: a timing side channel in RSA *private-key*
  # operations. `rsa` is here only through webauthn-rs, which uses it to *verify* RS256
  # passkey signatures with public keys. Sitewright never holds an RSA private key, so
  # there is nothing to recover. No fixed `rsa` release exists.
  { id = "RUSTSEC-2023-0071", reason = "rsa is used only for public-key signature verification (webauthn-rs); no RSA private keys exist" },
  # basic-toml is unmaintained. It is a build-time dependency of askama's derive macro
  # (it parses askama.toml during compilation) and is not part of the shipped binary.
  { id = "RUSTSEC-2026-0374", reason = "build-time only (askama_derive reads askama.toml); not in the binary" },
]

[licenses]
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
  "OpenSSL",
  "BSL-1.0",
  "0BSD",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
  # One TLS stack (rustls + ring); never link OpenSSL.
  { crate = "openssl-sys" },
  { crate = "native-tls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
