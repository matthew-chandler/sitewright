name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,sqlx-cli
      - name: Install Pebble (ACME test server)
        run: |
          for tool in pebble pebble-challtestsrv; do
            curl -fsSL "https://github.com/letsencrypt/pebble/releases/download/v2.8.0/${tool}-linux-amd64.tar.gz" | tar -xz -C "$RUNNER_TEMP"
            sudo install -m 0755 "$(find "$RUNNER_TEMP" -type f -name "$tool" | head -1)" "/usr/local/bin/$tool"
          done
          pebble -version
      - run: cargo fmt --all --check
      - name: sqlx offline data is up to date
        run: ./scripts/sqlx-prepare.sh --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo nextest run --workspace --no-tests=warn
        env:
          # The ACME tests must really run here, not skip.
          SW_REQUIRE_PEBBLE: "1"

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  musl:
    name: musl release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: musl
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0
      - run: cargo zigbuild --release --target x86_64-unknown-linux-musl -p sitewright
      - run: |
          file target/x86_64-unknown-linux-musl/release/sitewright | tee /dev/stderr | grep -q 'statically linked'
      # The backend worker is this binary. Run the backend tests against the static
      # build, because its system calls (and so its jail) differ from the glibc build.
      - run: |
          printf '#!/bin/sh\nexec "%s" __backend-worker\n' "$PWD/target/x86_64-unknown-linux-musl/release/sitewright" > "$RUNNER_TEMP/worker"
          chmod +x "$RUNNER_TEMP/worker"
          SW_BACKEND_TEST_WORKER="$RUNNER_TEMP/worker" cargo test -p sw-backend --test backend
      # Containerized sites: package a site with the static binary, then load and run
      # the image with the runner's Docker.
      - run: scripts/container-smoke.sh target/x86_64-unknown-linux-musl/release/sitewright

  skills:
    name: validate built-in skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: skills-ref validate
        run: |
          for skill in skills/*/; do
            npx --yes skills-ref@0.1.5 validate "$skill"
          done

  ci-ok:
    name: ci-ok
    if: always()
    needs: [check, deny, musl, skills]
    runs-on: ubuntu-latest
    steps:
      - run: |
          test "${{ needs.check.result }}" = success
          test "${{ needs.deny.result }}" = success
          test "${{ needs.musl.result }}" = success
          test "${{ needs.skills.result }}" = success
