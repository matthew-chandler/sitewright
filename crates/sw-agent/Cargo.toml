[package]
name = "sw-agent"
description = "Sitewright agent: the tool-calling loop, its tools and the skills loader"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
sw-core.workspace = true
sw-sites.workspace = true
sw-llm.workspace = true
futures-util = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "sync", "time", "macros"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
async-trait = "0.1.92"

[dev-dependencies]
async-trait = "0.1.92"
futures-util = "0.3.34"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
