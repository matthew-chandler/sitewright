[package]
name = "sw-tls"
description = "Sitewright TLS: ACME issuance, certificate store and per-hostname resolver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
sw-core.workspace = true
arc-swap = "1.9.5"
axum = "0.8.9"
hyper = "1.12.0"
hyper-util = { version = "0.1.21", features = ["tokio", "server-auto", "service"] }
instant-acme = { version = "0.8.5", default-features = false, features = ["ring", "hyper-rustls", "rcgen", "time", "x509-parser"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
time = "0.3.55"
tokio = { version = "1.54.1", features = ["fs", "rt", "net", "sync", "time", "macros"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-util = "0.7.20"
tower = "0.5.3"
tracing = "0.1.44"
x509-parser = "0.18.1"

[dev-dependencies]
rcgen = "0.14.10"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "process"] }
