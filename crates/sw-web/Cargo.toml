[package]
name = "sw-web"
description = "Sitewright web layer: site serving, admin UI, HTTP API, SSE and authentication"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
sw-core.workspace = true
sw-sites.workspace = true
sw-metrics.workspace = true
axum = "0.8.9"
http-body-util = "0.1.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "rt", "net", "sync", "time", "macros"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["fs", "compression-gzip", "compression-br", "trace"] }
tracing = "0.1.44"
