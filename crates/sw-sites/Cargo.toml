[package]
name = "sw-sites"
description = "Sitewright site manager: site store, git history, releases, validation and export"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
sw-core.workspace = true
arc-swap = "1.9.5"
flate2 = "1.1.11"
futures-util = "0.3.34"
git2 = { version = "0.21.0", default-features = false, features = ["vendored-libgit2"] }
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
tar = "0.4.46"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "net", "rt", "sync", "time"] }
tracing = "0.1.44"
scraper = "0.29.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rand = "0.10.3"
hex = "0.4.3"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
