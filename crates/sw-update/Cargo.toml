[package]
name = "sw-update"
description = "Sitewright updater: release checks, signature verification and binary self-replacement"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
sw-core.workspace = true
flate2 = "1.1.11"
hex = "0.4.3"
minisign-verify = "0.3.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json"] }
self-replace = "1.5.1"
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4.46"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "rt", "time", "macros"] }
tracing = "0.1.44"

[dev-dependencies]
flate2 = "1.1.11"
hex = "0.4.3"
minisign = "0.10.0"
semver = { version = "1.0.28", features = ["serde"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4.46"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6.5"
