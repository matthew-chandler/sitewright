[package]
name = "sitewright"
description = "Turn a prompt into a live website on your own server: one self-hosted binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
sw-update.workspace = true
sw-backend.workspace = true
semver = "1"
sw-tls.workspace = true
sw-agent.workspace = true
sw-llm.workspace = true
sw-metrics.workspace = true
sw-web.workspace = true
sw-sites.workspace = true
anyhow = "1.0.104"
toml = "1.2.1"
flate2 = "1.1.11"
sha2 = "0.11.1"
tar = "0.4.46"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
sw-core.workspace = true
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite"] }
tower-http = { version = "0.7.1", features = ["compression-gzip", "compression-br"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "fs", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
tokio-util = { version = "0.7.20", features = ["io"] }
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "stream", "query", "form"] }
futures-util = "0.3.34"
tower = "0.5.3"

[dev-dependencies]
base64 = "0.23.1"
ciborium = "0.2.2"
p256 = { version = "0.14.0", features = ["ecdsa"] }
rand = "0.10.3"
rcgen = "0.14.10"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["process", "macros", "rt-multi-thread"] }
wiremock = "0.6.5"
x509-parser = "0.18.1"
