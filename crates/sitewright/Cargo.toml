[package]
name = "sitewright"
description = "Turn a prompt into a live website on your own server: one self-hosted binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
sw-agent.workspace = true
sw-llm.workspace = true
sw-metrics.workspace = true
sw-web.workspace = true
sw-sites.workspace = true
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
sw-core.workspace = true
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "fs", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
tokio-util = "0.7.20"
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "stream", "query"] }
futures-util = "0.3.34"

[dev-dependencies]
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite"] }
tempfile = "3.27.0"
wiremock = "0.6.5"
