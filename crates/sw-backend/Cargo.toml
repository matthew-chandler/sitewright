[package]
name = "sw-backend"
description = "Sitewright site backends: a sandboxed JavaScript worker and the manager that runs it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[[bin]]
# The worker as its own program, for this crate's tests. Releases run the same code as a
# hidden subcommand of `sitewright`.
name = "sw-backend-worker"
path = "src/bin/worker.rs"

[dependencies]
getrandom = "0.4.3"
rquickjs = { version = "0.14.0", features = ["loader"] }
futures-util = "0.3.34"
libsqlite3-sys = ">=0.30.1, <0.38.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "sync", "time", "macros", "process", "io-util"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.191"
rustix = { version = "1.1.6", features = ["process"] }
seccompiler = "0.5.0"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
