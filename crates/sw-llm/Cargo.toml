[package]
name = "sw-llm"
description = "Sitewright LLM access: the LlmProvider trait and its provider adapters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
sw-core.workspace = true
async-trait = "0.1.92"
bytes = "1.12.1"
futures-util = "0.3.34"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["time", "sync", "macros", "rt"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "test-util"] }
toml = "1.2.1"
wiremock = "0.6.5"
