# Configuration of the VPS instance (devtest user). Copied to ~/sitewright-data/config.toml
# by scripts/deploy-dev.sh on first deploy; later edits on the server are never overwritten.
# LLM settings are appended by scripts/dev-secrets.sh.

[server]
mode = "proxy"
listen = "127.0.0.1:18080"
# nginx on the same machine forwards requests and sets X-Forwarded-For.
trusted_proxies = ["127.0.0.1/32"]

[domains]
zones = ["machandler.com"]
admin_host = "sitewright.machandler.com"
admin_url = "https://sitewright.machandler.com"
# Subdomains of machandler.com that other services on this server already use.
reserved_names = ["api", "cps", "erp", "fireworks", "league", "l", "population", "sun", "uuixd", "dev", "sitewright-dev"]
# Cloudflare terminates TLS for *.machandler.com.
public_scheme = "https"
